<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALFRED // BATCAVE OS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: Batcueva = negro carbón + amarillo neón + cian técnico ===== */
:root{
  --bg:#050505;
  --pan:#0b0d11;
  --bd:#262b33;
  --y:#ffd60a;
  --yg:rgba(255,214,10,.35);
  --c:#22d3ee;
  --cg:rgba(34,211,238,.35);
  --tx:#e5e7eb;
  --dim:#7b8494;
  --ok:#34d399;
  --er:#f87171;
  --p:rgba(11,13,17,.92);
  --ln:#262b33;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;color:var(--tx);font:14px 'Share Tech Mono',ui-monospace,Consolas,monospace;background:var(--bg)}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url('https://external-preview.redd.it/the-batcave-3072x1376-v0-AAC9-wY9ItRH34wUCCM2BNdzIAUd51bTCN50t75O_oo.png?width=1080&crop=smart&auto=webp&s=bfb1eaf2eefce4c053628f30675d2fc6eaba3ced') no-repeat center center fixed;
  background-size:cover;
  opacity:0.4;
  z-index:-1;
}

body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
header{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;z-index:5;border-bottom:1px solid var(--bd);background:var(--pan)}
.logo{font:800 17px Orbitron,sans-serif;letter-spacing:.25em;color:var(--y);text-shadow:0 0 12px var(--yg)}
nav{display:flex;gap:6px;margin:0 auto}
.btn,nav button{background:var(--pan);border:1px solid var(--bd);color:var(--dim);padding:6px 12px;font:inherit;letter-spacing:.12em;cursor:pointer;transition:.2s}
.btn:hover,nav button:hover{color:var(--tx);border-color:var(--y)}
nav button.on{color:#000;background:var(--y);border-color:var(--y);box-shadow:0 0 16px var(--yg);font-weight:700}
.chip{font-size:11px;letter-spacing:.15em;padding:4px 10px;border:1px solid var(--bd);color:var(--dim)}
.chip.ok{color:var(--ok);border-color:rgba(52,211,153,.3)}.chip.w{color:var(--y);border-color:var(--yg)}.chip.err{color:var(--er);border-color:rgba(248,113,113,.3)}
#clk{color:var(--dim);font-size:12px}

/* Input de configuración de servidor backend */
.api-config{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--dim)}
.api-config input{background:var(--bg);border:1px solid var(--bd);color:var(--tx);font:inherit;padding:4px 8px;border-radius:3px;width:150px}

main{flex:1;position:relative;min-height:0}
.sec{position:absolute;inset:0;overflow:auto;display:none;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.sec.on{display:flex}

/* ===== HUD central ===== */
#hud{position:fixed;left:50%;top:50%;width:min(100vmin,980px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;opacity:.25;transition:opacity .6s}
.m-v #hud{opacity:1}.m-s #hud{opacity:.1}
.s1{animation:sp 90s linear infinite}.s2{animation:sp 60s linear infinite reverse}.s3{animation:sp 40s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gl{filter:drop-shadow(0 0 7px var(--y))}
.talk .gl{filter:drop-shadow(0 0 16px var(--y))}
.pulse .gl{animation:fl .9s ease-out}.busy .gl{animation:fl 1s infinite}
@keyframes fl{40%{filter:drop-shadow(0 0 26px var(--y)) brightness(1.7)}}

/* ===== Taza (Modo Voz) ===== */
#cupw{position:fixed;left:50%;top:50%;width:min(36vmin,360px);transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity .6s}
.m-v #cupw{opacity:1}
#cup{width:100%;display:block;filter:drop-shadow(0 0 10px var(--yg));transition:filter .4s}
.talk #cup,.busy #cup{filter:drop-shadow(0 0 24px var(--y))}
.steam path{stroke-dasharray:44;stroke-width:2.2;opacity:0;animation:sm 3.4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1.1s}.steam path:nth-child(3){animation-delay:2.2s}
.talk .steam path{animation-duration:1.4s}
@keyframes sm{0%{stroke-dashoffset:44;opacity:0}30%{opacity:.7}100%{stroke-dashoffset:-44;opacity:0}}
.bat{fill:var(--y);fill-opacity:.85;filter:drop-shadow(0 0 4px var(--yg))}

/* ===== Modo Voz ===== */
.vc{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;z-index:2}
#vsub{max-width:min(680px,92vw);min-height:20px;max-height:18vh;overflow:auto;color:var(--y);text-shadow:0 0 8px #000,0 0 14px #000}
#vtr{color:var(--dim);font-size:12px;letter-spacing:.1em;text-shadow:0 0 8px #000}
.mic{width:76px;height:76px;border-radius:50%;background:var(--pan);border:2px solid var(--y);color:var(--y);cursor:pointer;display:grid;place-items:center;box-shadow:0 0 18px var(--yg)}
.mic.on{background:var(--y);color:#000;animation:mp 1.1s infinite}
@keyframes mp{0%{box-shadow:0 0 0 0 var(--yg)}100%{box-shadow:0 0 0 28px rgba(255,214,10,0)}}
.vc label{font-size:11px;color:var(--dim);letter-spacing:.1em;cursor:pointer}

/* ===== Modo Texto ===== */
.con{margin:auto;width:min(780px,100%);height:100%;max-height:680px;display:flex;flex-direction:column;background:var(--pan);border:1px solid var(--bd);backdrop-filter:blur(5px);box-shadow:0 0 40px rgba(255,214,10,.1)}
#log{flex:1;overflow:auto;padding:14px}
.m{margin-bottom:12px;max-width:88%;padding:8px 12px;border-left:2px solid;white-space:pre-wrap;word-break:break-word;animation:in .3s}
.m b{display:block;font-size:10px;letter-spacing:.25em;opacity:.7;margin-bottom:3px}
.m.u{margin-left:auto;border-color:var(--c);background:#171a20;color:var(--tx)}
.m.a{border-color:var(--y);background:#0f1216}
.m.e{border-color:var(--er);color:#fecaca}
.dots{animation:bl .8s infinite alternate}
@keyframes bl{to{opacity:.3}}@keyframes in{from{opacity:0;transform:translateY(8px)}}
#f{display:flex;border-top:1px solid var(--bd)}
#f span{padding:12px 0 0 12px;color:var(--y)}
#in{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;padding:12px}

/* ===== Estadísticas ===== */
.st{margin:0 auto;width:min(1100px,100%);display:grid;grid-template-columns:1.15fr .85fr;gap:12px;align-content:start}
.pn{background:var(--pan);border:1px solid var(--bd);padding:12px;backdrop-filter:blur(5px)}
.pn h3{font:600 12px Orbitron,sans-serif;letter-spacing:.25em;color:var(--y);margin:2px 0 10px}
#bd{width:100%;max-height:74vh;display:block}
.sc{animation:sn 4.5s linear infinite}@keyframes sn{to{transform:translateY(540px)}}
.cl{font-size:9px;fill:var(--dim);letter-spacing:.1em}.cv{font-size:15px;fill:var(--c)}.cu{font-size:9px;fill:var(--dim)}
.ld{fill:none;stroke:var(--y);stroke-width:.8;stroke-opacity:.5}.bg{fill:rgba(255,214,10,.15)}.br{fill:var(--y)}
.hb{animation:hb 1s infinite}@keyframes hb{50%{opacity:.2}}
#tf{display:flex;gap:6px;margin-bottom:8px}
#ti,#ins input{background:var(--bg);border:1px solid var(--bd);color:var(--tx);font:inherit;padding:8px;min-width:0;width:100%}
#tl{list-style:none;max-height:34vh;overflow:auto}
#tl li{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--bd)}
#tl li span{flex:1}#tl li.d span{text-decoration:line-through;color:var(--dim)}
#tl button{background:none;border:0;color:var(--er);cursor:pointer;font-size:15px}
#tl input{accent-color:var(--y);width:16px;height:16px}
#tc{font-size:11px;color:var(--dim);margin:8px 0 16px;letter-spacing:.1em}
#ins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ins label{font-size:10px;color:var(--dim);letter-spacing:.08em}

/* ===== Modal de pantalla en vivo ===== */
.mod{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.35s}
.mod.on{opacity:1;pointer-events:auto}
.mp{width:min(1100px,96vw);border:1px solid var(--y);background:var(--pan);box-shadow:0 0 40px var(--yg);transform:scale(.92) translateY(20px);transition:.35s}
.mod.on .mp{transform:none}
.mh{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--bd)}
.mh b{color:var(--y);letter-spacing:.15em}.mh span{flex:1;color:var(--dim);font-size:12px}
.mp img{width:100%;max-height:82vh;object-fit:contain;display:block;min-height:180px;background:#000}

@media(max-width:820px){.st{grid-template-columns:1fr}nav{order:3;width:100%;justify-content:center}.logo{font-size:14px}#clk{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition:none!important}}
</style>
</head>
<body class="m-t">

<svg id="hud" viewBox="-400 -400 800 800" fill="none" aria-hidden="true">
 <g class="s1"><circle r="384" stroke="#7b8494" stroke-width="2.5" stroke-dasharray="900 50 420 50 640 70 180 90"/></g>
 <g class="s2"><circle r="352" stroke="#262b33" stroke-width="9" stroke-dasharray="1.5 11"/></g>
 <g class="s3"><circle r="300" stroke="#7b8494" stroke-width="3" stroke-dasharray="230 28 70 28 330 28"/></g>
 <g fill="#7b8494" font-size="12" text-anchor="middle" letter-spacing="2">
  <text transform="rotate(-75) translate(0 -320)">BATCOMP</text><text transform="rotate(-45) translate(0 -320)">GOTHAM</text><text transform="rotate(-15) translate(0 -320)">ARSENAL</text>
  <text transform="rotate(15) translate(0 -320)">RADAR</text><text transform="rotate(45) translate(0 -320)">ARCHIVOS</text><text transform="rotate(75) translate(0 -320)">ALFRED</text></g>
 <g class="gl"><g class="s1"><circle r="258" stroke="#ffd60a" stroke-width="16" stroke-dasharray="34 9"/></g></g>
 <g class="s2"><circle r="232" stroke="#e5e7eb" stroke-width="6" stroke-dasharray="20 32" opacity=".85"/></g>
 <circle r="205" stroke="#ffd60a" opacity=".35"/>
 <g class="s3"><circle r="165" stroke="#ffd60a" stroke-width="3" stroke-dasharray="1 10" opacity=".6"/></g>
 <circle cy="-376" r="14" stroke="#ffd60a" stroke-width="2"/><circle cy="376" r="14" stroke="#ffd60a" stroke-width="2"/>
</svg>

<div id="cupw"><svg id="cup" viewBox="0 0 200 200" aria-hidden="true">
 <defs>
  <linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#07080a"/><stop offset=".55" stop-color="#1b1f26"/><stop offset=".85" stop-color="#2b2a14"/><stop offset="1" stop-color="#07080a"/></linearGradient>
 </defs>
 <ellipse cx="100" cy="172" rx="76" ry="11" fill="#0c0e12" stroke="#2a2f37"/>
 <path d="M148 92h10a19 19 0 0 1 0 38h-14" stroke="#252a32" stroke-width="8" fill="none"/>
 <path d="M52 84h96v36a48 40 0 0 1-96 0z" fill="url(#cg)" stroke="#333943"/>
 <ellipse cx="100" cy="84" rx="48" ry="9" fill="#14171c" stroke="#3a414c"/><ellipse cx="100" cy="84" rx="38" ry="5" fill="#070403"/>
 <path class="bat" transform="translate(100 114) scale(.72) translate(-100 -110)" d="M100 100 95 94 94 101C86 98 74 99 62 106 68 106 72 110 74 116 78 111 84 111 88 115 92 111 96 112 100 120 104 112 108 111 112 115 116 111 122 111 126 116 128 110 132 106 138 106 126 99 114 98 106 101L105 94Z"/>
 <g class="steam" fill="none" stroke="#e5e7eb" stroke-linecap="round"><path d="M86 74c-8-10 8-16 0-28"/><path d="M100 74c-8-12 8-18 0-34"/><path d="M114 74c-8-10 8-16 0-26"/></g>
</svg></div>

<header>
 <span class="logo">ALFRED</span>
 <span id="stt" class="chip">STANDBY</span>
 <div class="api-config">
   <label for="api-url-input">API:</label>
   <input id="api-url-input" type="text" value="http://127.0.0.1:8000" title="URL del backend FastAPI de Alfred">
 </div>
 <nav><button data-m="t" class="on">TEXTO</button><button data-m="v">VOZ</button><button data-m="s">ESTADÍSTICAS</button></nav>
 <button class="btn" id="bs" title="Atajo: activa compartir pantalla">⛶ PANTALLA</button><span id="clk"></span>
</header>

<main>
 <!-- MODO TEXTO -->
 <section id="v-t" class="sec on"><div class="con"><div id="log"></div>
  <form id="f"><span>&gt;</span><input id="in" autocomplete="off" placeholder="Ordene algo a Alfred…" aria-label="Comando"><button class="btn">ENVIAR</button></form></div></section>

 <!-- MODO VOZ -->
 <section id="v-v" class="sec"><div class="vc">
  <div id="vsub"></div><div id="vtr">Pulse el micrófono y hable</div>
  <button class="mic" id="mic" aria-label="Micrófono"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <label><input type="checkbox" id="tts" checked> VOZ DE ALFRED</label></div></section>

 <!-- ESTADÍSTICAS -->
 <section id="v-s" class="sec"><div class="st">
  <div class="pn"><h3>ESCÁNER CORPORAL</h3>
   <svg id="bd" viewBox="0 0 460 470">
    <defs>
     <g id="b"><ellipse cx="100" cy="36" rx="17" ry="22"/><rect x="92" y="56" width="16" height="16"/>
      <path d="M66 80Q100 68 134 80L126 170 128 204H72L74 170Z"/>
      <path d="M72 204H99L96 318 92 436H76L74 318Z"/><path d="M128 204H101L104 318 108 436H124L126 318Z"/>
      <path d="M66 80 54 84 40 170 34 236 46 240 56 176 68 120Z"/><path d="M134 80 146 84 160 170 166 236 154 240 144 176 132 120Z"/></g>
     <pattern id="hl" width="4" height="5" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#ffd60a" stroke-opacity=".35"/></pattern>
     <linearGradient id="sg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffd60a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd60a" stop-opacity="0"/></linearGradient>
     <mask id="bm"><use href="#b" fill="#fff"/></mask>
    </defs>
    <g transform="translate(130 0)">
     <use href="#b" fill="rgba(255,214,10,.07)" stroke="#ffd60a" stroke-width="1.3" style="filter:drop-shadow(0 0 5px #ffd60a)"/>
     <g mask="url(#bm)"><rect width="200" height="470" fill="url(#hl)"/><g class="sc"><rect y="-60" width="200" height="60" fill="url(#sg)"/><rect y="-1" width="200" height="2" fill="#e5e7eb"/></g></g>
     <circle cx="112" cy="104" r="3.5" class="hb" fill="#ffd60a"/>
    </g>
    <g id="co"></g>
   </svg></div>
  <div class="pn"><h3>MISIONES // TO-DO</h3>
   <form id="tf"><input id="ti" placeholder="Nueva tarea…" aria-label="Nueva tarea" autocomplete="off"><button class="btn">+</button></form>
   <ul id="tl"></ul><div id="tc"></div>
   <h3>REGISTRO BIOMÉTRICO</h3><div id="ins"></div></div>
 </div></section>
</main>

<canvas id="fx" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3"></canvas>

<div id="scr" class="mod"><div class="mp">
 <div class="mh"><b>◉ PANTALLA EN VIVO</b><span id="ss">CONECTANDO…</span><button class="btn" id="sx">CERRAR ✕</button></div>
 <img id="si" alt="Pantalla de la laptop en tiempo real"></div></div>

<script>
const TOKEN='clave_secreta_ultraseguro_para_alfred_2026';

// Obtener o configurar la URL del backend dinámicamente con persistencia en localStorage
const apiInput = $('api-url-input');
const savedApi = localStorage.getItem('ALFRED_API_URL');
if(savedApi) { apiInput.value = savedApi; }

function getAPI() {
  return apiInput.value.replace(/\/+$/, ''); // Eliminar barra diagonal final si la hubiera
}

apiInput.onchange = () => {
  localStorage.setItem('ALFRED_API_URL', getAPI());
};

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let mode='t',busy=false;

setInterval(()=>$('clk').textContent=new Date().toLocaleString('es',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}),1e3);
function st(t,c){$('stt').textContent=t;$('stt').className='chip '+c;document.body.classList.toggle('busy',c=='w')}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function setMode(m){mode=m;for(const x of'tvs'){document.body.classList.toggle('m-'+x,x==m);$('v-'+x).classList.toggle('on',x==m)}
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));
 if(m!='v'){fx(0);'speechSynthesis'in window&&speechSynthesis.cancel()}}

const cv=$('fx'),cx=cv.getContext('2d');let P=[],sp=0;
function rs(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();
function emit(x,y,n){for(let i=0;i<n&&P.length<900;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,v=.4+Math.random()*1.9;
 P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1+Math.random()*2.6,l:0,m:70+Math.random()*100,h:Math.random()<.25?48:190,f:Math.random()*6.28})}}
(function loop(){cx.clearRect(0,0,innerWidth,innerHeight);cx.globalCompositeOperation='lighter';
 P=P.filter(p=>p.l++<p.m);for(const p of P){p.f+=.08;p.x+=p.vx+Math.sin(p.f)*.4;p.y+=p.vy;p.vy-=.006;p.vx*=.995;const t=1-p.l/p.m;
  cx.fillStyle=`hsla(${p.h},100%,65%,${t*.9})`;cx.shadowColor=`hsl(${p.h},100%,60%)`;cx.shadowBlur=9;cx.beginPath();cx.arc(p.x,p.y,p.r*(.5+t),0,6.283);cx.fill()}
 requestAnimationFrame(loop)})();

function spores(n,pulse=1){let x=innerWidth/2,y=innerHeight/2;
 if(mode=='v'){const r=$('cupw').getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height*.4}
 else if(mode=='t'){const m=[...document.querySelectorAll('.m.a')].pop();if(m){const r=m.getBoundingClientRect();x=r.left+Math.min(r.width,300)/2;y=r.top}}
 emit(x,y,n);if(pulse){const h=$('hud');h.classList.remove('pulse');void h.getBoundingClientRect();h.classList.add('pulse')}}
function fx(on){document.body.classList.toggle('talk',!!on);clearInterval(sp);if(on)sp=setInterval(()=>spores(3,0),110)}

function add(c,t,dots){const d=document.createElement('div');d.className='m '+c;const b=document.createElement('b'),s=document.createElement('span');
 b.textContent={u:'OPERADOR',a:'ALFRED',e:'SISTEMA'}[c];s.textContent=dots?'PROCESANDO…':t;if(dots)s.className='dots';
 d.append(b,s);$('log').append(d);$('log').scrollTop=1e9;return d}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim();
function reply(t,src){add('a',t);$('vsub').textContent=t;spores(80);speak(t)}
async function handle(text,src){text=text.trim();if(!text||busy)return;add('u',text);
 if(norm(text).includes('activa compartir pantalla')){openScr();return reply('Activando la visualización de su pantalla, señor.',src)}
 busy=true;st('PROCESANDO…','w');$('vsub').textContent='Procesando…';const ty=add('a','',1);
 try{
  const currentAPI = getAPI();
  const r=await fetch(currentAPI+'/v1/command',{method:'POST',headers:{'Content-Type':'application/json','X-ALFRED-Token':TOKEN},body:JSON.stringify({prompt:text}),signal:AbortSignal.timeout(6e4)});
  if(!r.ok)throw new Error(r.status==401||r.status==403?'Token rechazado (HTTP '+r.status+')':'Error del servidor (HTTP '+r.status+')');
  const o=(r.headers.get('content-type')||'').includes('json')?await r.json():await r.text();
  const t=typeof o=='string'?o:(o.response??o.reply??o.message??o.text??o.result??o.output??JSON.stringify(o));
  ty.remove();st('EN LÍNEA','ok');reply(String(t),src)
 }catch(e){ty.remove();st('SIN ENLACE','err');const m=e.name=='TimeoutError'?'Tiempo de espera agotado':e.message=='Failed to fetch'?'Sin conexión con el backend ('+getAPI()+')':e.message;
  add('e','⚠ '+m);$('vsub').textContent='⚠ '+m
 }finally{busy=false}}
$('f').onsubmit=e=>{e.preventDefault();if(busy)return;const v=$('in').value;$('in').value='';handle(v,'t')};

function speak(t){const ok=mode=='v'&&$('tts').checked&&'speechSynthesis'in window;
 if(!ok){if(mode=='v'){fx(1);setTimeout(()=>fx(0),2500)}return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*_`#]/g,'')),V=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
 u.voice=V.find(v=>/male|jorge|diego|pablo|enrique|raul|juan/i.test(v.name))||V[0]||null;u.lang='es-ES';u.pitch=.8;u.rate=.95;
 u.onstart=()=>fx(1);u.onend=u.onerror=()=>fx(0);speechSynthesis.speak(u)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,lis=0;
$('mic').onclick=()=>{
 if(!SR){$('vtr').textContent='Este navegador no soporta reconocimiento de voz.';return}
 if(lis){rec.stop();return}
 'speechSynthesis'in window&&speechSynthesis.cancel();fx(0);rec=new SR();rec.lang='es-PE';rec.interimResults=true;
 rec.onstart=()=>{lis=1;$('mic').classList.add('on');$('vtr').textContent='Escuchando…'};
 rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;$('vtr').textContent='“'+t+'”';if(e.results[e.results.length-1].isFinal)handle(t,'v')};
 rec.onerror=e=>{$('vtr').textContent='Error de micrófono: '+e.error};
 rec.onend=()=>{lis=0;$('mic').classList.remove('on')};rec.start()};

let ac,last='';
const idx=(b,a,c,s)=>{for(let i=s;i<b.length-1;i++)if(b[i]==a&&b[i+1]==c)return i;return -1};
function show(b){const u=URL.createObjectURL(b);$('si').src=u;if(last)URL.revokeObjectURL(last);last=u;$('ss').textContent='EN VIVO · '+new Date().toLocaleTimeString()}
function openScr(){$('scr').classList.add('on');ac&&ac.abort();ac=new AbortController();pump(ac.signal)}
function closeScr(){$('scr').classList.remove('on');ac&&ac.abort()}
async function pump(sig){
 while(!sig.aborted){try{
  const currentAPI = getAPI();
  const r=await fetch(currentAPI+'/v1/screen/stream',{headers:{'X-ALFRED-Token':TOKEN},signal:sig});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const ct=r.headers.get('content-type')||'';
  if(ct.includes('image/')){show(await r.blob());await sleep(150);continue}
  if(ct.includes('json')){const j=await r.json(),f=j.frame||j.image;if(f)$('si').src='data:image/jpeg;base64,'+f;$('ss').textContent='EN VIVO';await sleep(200);continue}
  const rd=r.body.getReader();let buf=new Uint8Array(0);
  for(;;){const{done,value}=await rd.read();if(done)break;
   const n=new Uint8Array(buf.length+value.length);n.set(buf);n.set(value,buf.length);buf=n;
   let s=idx(buf,255,216,0),e=s<0?-1:idx(buf,255,217,s+2);
   while(s>=0&&e>=0){show(new Blob([buf.slice(s,e+2)],{type:'image/jpeg'}));buf=buf.slice(e+2);s=idx(buf,255,216,0);e=s<0?-1:idx(buf,255,217,s+2)}
   if(s<0&&buf.length>2e6)buf=new Uint8Array(0)}
 }catch(e){if(sig.aborted)return;$('ss').textContent='ERROR: '+e.message+' · reintentando…';await sleep(1500)}}}
$('bs').onclick=openScr;$('sx').onclick=closeScr;$('scr').onclick=e=>e.target.id=='scr'&&closeScr();
addEventListener('keydown',e=>e.key=='Escape'&&closeScr());

const M=[['sleep','SUEÑO','h',9,'L',30,214,36],['spo2','SpO₂','%',100,'L',94,216,100],['kin','CAL CONSUMIDAS','kcal',2400,'L',158,224,158],
 ['water','HIDRATACIÓN','L',3,'L',222,172,234],['steps','PASOS','',10000,'L',322,212,322],
 ['kg','PESO','kg',100,'R',30,246,36],['hr','RITMO CARDÍACO','bpm',180,'R',94,242,104],['kout','CAL QUEMADAS','kcal',900,'R',158,238,158],
 ['fat','GRASA CORPORAL','%',35,'R',222,288,234],['bal','BALANCE CALÓRICO','kcal',1000,'R',322,248,322]];
const S=Object.assign({sleep:7,spo2:98,kin:1850,water:1.6,steps:6400,kg:78,hr:72,kout:620,fat:16},ls('S',{}));
const val=k=>k=='bal'?S.kin-S.kout:+S[k]||0;
function drawBody(){$('co').innerHTML=M.map(([k,l,u,mx,s,y,ax,ay])=>{const v=val(k),L=s=='L',x=L?6:454,bx=L?6:354,w=Math.min(100,Math.abs(v)/mx*100),a=L?'start':'end';
 return `<polyline class="ld" points="${L?108:352},${y+10} ${L?122:338},${y+10} ${ax},${ay}"/><circle cx="${ax}" cy="${ay}" r="2.5" fill="#ffd60a"/>
 <text class="cl" x="${x}" y="${y}" text-anchor="${a}">${l}</text>
 <text class="cv" x="${x}" y="${y+18}" text-anchor="${a}">${(k=='bal'&&v>0?'+':'')+v.toLocaleString('es')}<tspan class="cu"> ${u}</tspan></text>
 <rect class="bg" x="${bx}" y="${y+24}" width="100" height="3"/><rect class="br" x="${bx}" y="${y+24}" width="${w}" height="3"/>`}).join('')}
$('ins').innerHTML=M.filter(m=>m[0]!='bal').map(m=>`<label>${m[1]} (${m[2]||'u'})<input type="number" step="any" data-k="${m[0]}" value="${S[m[0]]}"></label>`).join('');
$('ins').oninput=e=>{const k=e.target.dataset.k;if(k){S[k]=+e.target.value||0;sv('S',S);drawBody()}};
drawBody();

let T=ls('T',[{t:'Revisar registros de Alfred',d:0},{t:'Entrenamiento de 45 min',d:0},{t:'Beber 3 L de agua',d:1}]);
function drawT(){$('tl').innerHTML='';T.forEach((o,i)=>{const li=document.createElement('li'),c=document.createElement('input'),s=document.createElement('span'),x=document.createElement('button');
 li.className=o.d?'d':'';c.type='checkbox';c.checked=!!o.d;c.setAttribute('aria-label','Completada');c.onchange=()=>{o.d=c.checked?1:0;sv('T',T);drawT()};
 s.textContent=o.t;x.textContent='✕';x.setAttribute('aria-label','Eliminar');x.onclick=()=>{T.splice(i,1);sv('T',T);drawT()};li.append(c,s,x);$('tl').append(li)});
 $('tc').textContent=T.filter(o=>o.d).length+'/'+T.length+' COMPLETADAS'}
$('tf').onsubmit=e=>{e.preventDefault();const t=$('ti').value.trim();if(t){T.push({t,d:0});$('ti').value='';sv('T',T);drawT()}};
drawT();
